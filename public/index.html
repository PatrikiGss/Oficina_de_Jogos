<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ping-Pong da Oficina</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-content: center;
      background: #0b0f14;
      color: #7d8da1;
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      max-width: 100%;
      border: 2px solid #2a3a4a;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <canvas id="campo"></canvas>
  <p>W / S ou ↑ / ↓ movem a sua raquete · Espaço começa outra partida</p>
  <script type="module" src="cliente.js"></script> <!-- module permite usar import/export no navegador -->
</body>
</html>
